name: sql-ai-cardinality-lab
services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    container_name: sql-ai-cardinality-lab-pg
    network_mode: none
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: cardinality_lab
    volumes:
      - ./data/tpch_sf1:/tpch-data:ro
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=64MB", "-c", "max_parallel_workers_per_gather=0", "-c", "jit=off", "-c", "autovacuum=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cardinality_lab"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
    name: sql-ai-cardinality-lab-pgdata
